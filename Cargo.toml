[package]
name = "gddbg"
version = "0.1.0"
edition = "2024"
description = "Disassembler / call-graph explorer for Geometry Dash levels, built on gdlib"
publish = false

# its own workspace, separate from gdlib's
[workspace]

[[bin]]
name = "gddbg"
path = "src/main.rs"

[dependencies]
gdlib = { path = "../gdlib" }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
opt-level = 3
